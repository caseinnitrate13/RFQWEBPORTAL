<div class="container-fluid">
  <h3 class="fw-bold">Account</h3>
  <p>Manage your profile details, update your information, and change your password from this section.</p>
  <section class="section">
    <div class="row">

      <!-- Profile Details -->
      <div class="col-lg-6">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title"></h5>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">Profile Details</h5>
              <button class="btn btn-dark btn-sm">
                <i class="bi bi-pencil me-1"></i> Edit Info
              </button>
            </div>

            <form>
              <div class="row mb-3">
                <label class="col-sm-4 col-form-label fw-semibold">Username:</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control">
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-4 col-form-label fw-semibold">Email:</label>
                <div class="col-sm-8">
                  <input type="email" class="form-control" readonly>
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-4 col-form-label fw-semibold">Contact No.:</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" readonly>
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-4 col-form-label fw-semibold">Department:</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" readonly>
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-4 col-form-label fw-semibold">Position:</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" readonly>
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-4 col-form-label fw-semibold">Organization Name:</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" readonly>
                </div>
              </div>

              <div class="row">
                <label class="col-sm-4 col-form-label fw-semibold">Organization Address:</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" readonly>
                </div>
              </div>
            </form>

          </div>
        </div>
      </div>

      <!-- Change Password -->
      <div class="col-lg-6">
        <div class="card">
          <div class="card-body">
             <h5 class="card-title"></h5>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">Change your password</h5>
              <button class="btn btn-dark btn-sm">
                <i class="bi bi-key me-1"></i> Change
              </button>
            </div>

            <form>
              <div class="row mb-3">
                <label class="col-sm-5 col-form-label fw-semibold">Current Password:</label>
                <div class="col-sm-7">
                  <input type="password" class="form-control">
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-5 col-form-label fw-semibold">New Password:</label>
                <div class="col-sm-7">
                  <input type="password" class="form-control">
                </div>
              </div>

              <div class="row">
                <label class="col-sm-5 col-form-label fw-semibold">Repeat New Password:</label>
                <div class="col-sm-7">
                  <input type="password" class="form-control">
                </div>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>
</div>
